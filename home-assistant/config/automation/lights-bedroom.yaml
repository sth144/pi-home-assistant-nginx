- id: "1639939566463"
  alias: bedroom-lights-button-toggle-bedroom-string-lights
  description: >-
    Toggle the bedroom string lights smart plug from a short press of the Bedroom
    Lights Button (eWeLink SNZB-01P). Replaces the retired LUMI Smart Button 1
    (ieee 00:15:8d:00:07:9b:5d:50).
  trigger:
    # ZHA device trigger rather than a zha_event trigger keyed on device_ieee:
    # the SNZB-01P has no zha-quirks entry, so its zha_event command string is
    # not documented, but the logbook confirms ZHA resolves this device to
    # remote_button_short_press/button. If the button is ever re-paired its
    # device_id changes and this trigger must be updated.
    - platform: device
      device_id: bf4498213597c83ef42ea3653026034b
      domain: zha
      type: remote_button_short_press
      subtype: button
  condition: []
  action:
    - service: switch.toggle
      target:
        entity_id: switch.smart_plug_0
  mode: single
